<!doctype html><html><head><meta charset="utf-8">
<title>Orbit</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/orbit-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/orbit-192.png?v=2">
<link rel="apple-touch-icon" href="/icons/orbit-180.png?v=2">
<link rel="stylesheet" href="/vendor/katex/dist/katex.min.css">
<script src="/vendor/katex/dist/katex.min.js"></script>
<script src="/vendor/marked/marked.umd.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<script src="/vendor/highlight/highlight.min.js"></script>
<link rel="stylesheet" href="/vendor/highlight/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/vendor/highlight/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script defer src="/vendor/katex/dist/contrib/auto-render.min.js"></script>
<script defer src="/vendor/mermaid/dist/mermaid.min.js"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2c5bf0"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<aside id=side>
  <div class=brand><img class=mark src="/icons/orbit-64.png?v=2" alt="" width=20 height=20>
   <span class=wordmark>Orbit</span><span class="dot" id=dot title="model server"></span>
   <small id=badge>local</small>
   <button class=iconbtn2 id=srvmenu title="Local model server: start, stop, restart">⏻</button>
   <button class=iconbtn2 id=sidehide title="Narrow the sidebar to icons, then hide it (☰ cycles it back)">«</button></div>
  <div class=srvbar id=srvbar style="display:none">
    <button id=srv_start>Start</button><button id=srv_stop>Stop</button><button id=srv_restart>Restart</button>
  </div>
  <div class=sidetop>
   <button class=newbtn id=newchat>+ New chat</button>
   <button class=newbtn id=newwith title="New chat with a model, folder and permission mode — or a saved preset">▾</button>
  </div>
  <button class=searchbtn id=searchbtn title="Search chats, messages, files and commands"><span>⌕ Search</span><kbd>⌘P</kbd></button>
  <button class=searchbtn id=crewbtn title="A builder and a reviewer chat that keep improving a project, round after round, until you stop them"><span>⟳ Crew — build · review · improve</span></button>
  <button class=searchbtn id=clusterbtn title="Your jobs, the queue, the disk, the GPUs and what went wrong on the cluster"><span>▦ Cluster — jobs · disk · GPUs</span></button>
  <div class=navtabs>
    <button id=nav_chats class=on>Chats</button>
    <button id=nav_files>Files</button>
    <button id=nav_lib>Library</button>
    <button id=nav_tasks title="messages scheduled in any chat, and tasks that run on their own">Scheduled</button>
    <button id=nav_trash>Trash</button>
  </div>
  <div class=sidescroll id=sidescroll>
   <div id=sidestatus></div>
   <div class=sechead data-sec=projects><span class=caret>▾</span><span class=lbl>Projects</span>
    <span class=ct id=projct></span><button class=secbtn id=addproj title="New project">+</button></div>
   <div class=secbody data-sec=projects><div id=projwrap></div></div>
   <div class=sechead data-sec=chats><span class=caret>▾</span><span class=lbl id=chatslbl>Chats</span>
    <span class=ct id=chatct></span>
    <select class=filtersel id=filtersel title="Which chats">
     <option value=active>Active</option><option value=pinned>Pinned</option><option value=archived>Archived</option>
     <option value=all>All</option><option value=attention>Needs attention</option></select>
    <select class=filtersel id=groupsel title="How the chats are grouped">
     <option value=date>By date</option><option value=project>By project</option></select></div>
   <div class=secbody data-sec=chats>
    <input class=search id=search placeholder="Filter by title  (⌘F)">
    <div class=tagrow id=tagrow></div>
    <div class=slist id=slist></div>
   </div>
   <div id=extsecs></div>
   <div id=sharedsecs></div>
  </div>
  <div class=foot>
    <a id=opensettings title="Settings (⌘,)">⚙ Settings</a>
    <a id=footmore title="Memory, prompts, doctor, shortcuts, help">⋯ More</a>
    <span id=fmodel></span>
    <span style="display:none"><a id=openmem></a><a id=openprompts></a><a id=opendoctor></a><a id=openkeys></a><a id=openabout></a></span>
  </div>
</aside>

<main>
  <div class="tabstrip off" id=tabstrip></div>
  <div class=top>
    <button class=ghost id=toggle>&#9776;</button>
    <b id=title title="click to rename">New chat</b>
    <span id=runbadge class=note style="color:var(--acc)"></span>
    <button class="ghost wtbadge" id=wtbadge style="display:none" onclick="openWorktree()"></button>
    <span style="margin-left:auto;display:flex;gap:7px">
      <button class=ghost id=easybtn>easy</button>
      <button class=ghost id=staybtn>stay</button>
      <button class=ghost id=tempbtn title="temporary chat — nothing is saved">temp</button>
      <button class=ghost id=burnbtn style="display:none;border-color:var(--err);color:var(--err)">burn</button>
      <button class=ghost id=compact>compact</button>
      <button class=ghost id=more title="more">⋯</button>
      <button class=ghost id=settings2>settings</button>
    </span>
  </div>
  <div id=log><div class=hero id=hero style="display:none"></div><div class=wrap id=wrap></div></div>
  <button class=tobottom id=tobottom>&#8595;</button>
  <div id=files class=fileview style="display:none;overflow-y:auto"></div>
  <div id=lib class=fileview style="display:none;overflow-y:auto"></div>
  <div id=tasks class=fileview style="display:none;overflow-y:auto"></div>
  <div id=trash class=fileview style="display:none;overflow-y:auto"></div>
  <div id=shared style="display:none;padding:0;overflow:hidden;flex:1 1 auto;min-height:0;position:relative"></div>
  <div class=composer><div class=cwrap>
    <div class=statusline id=statusline style="display:none"></div>
    <div class=goalbar id=goalbar style="display:none"></div>
    <div class=plandock id=plandock style="display:none"></div>
    <div class=queuebox id=queuebox style="display:none"></div>
    <div class=chips id=chips></div>
    <div class=enginebar id=enginebar>
    <button id=engchip class=engchip title="Engine, model, account and effort for this chat"><span class=engname></span><span class=engmodel></span><span class=engextra></span><span class=engcaret>▾</span></button>
    <div id=engpop class=engpop role=dialog aria-label="Engine and model">
     <div class=engsec><label>Engine</label><div id=engpills class=engpills></div></div>
     <div class="engsec engmodelrow"><label>Model</label><div class=engctl>
    <span id=hpick><select id=hprov class=ghost title="provider"></select><select id=hmodel class=ghost title="model for this chat"></select>
      <button class=ghost id=hrefresh title="refresh this provider's model list" style="padding:2px 7px">↻</button>
      <select id=hacct class=ghost style="display:none" title="which Claude account this chat runs on"></select></span>
    <select id=modelsel class=ghost title="model for this chat"></select></div></div>
     <div class=engsec><label>Effort</label><div class=engctl><select id=heffort class=ghost title="how hard this chat thinks"></select></div></div>
     <div class="engsec engagentrow"><label>Agent</label><div class=engctl><select id=agentsel class=ghost><option value="">no agent</option></select></div></div>
    </div>
    <button id=hmode style="display:none"></button><button id=cmode style="display:none"></button>
    <button id=opbadge class=opbadge style="display:none" title="cheaper hours for this model — click for details"></button>
    <span class=ebsp></span>
    <span class=ctx id=ctxbox style="display:none">
      <span class=bar><i id=ctxbar></i></span><span id=ctxtxt></span></span>
    </div>
    <div class=row>
      <button class=iconbtn id=attach title="Attach file or image">+</button>
      <textarea id=q rows=1 placeholder="Ask anything — / for commands, @ for files, drop to attach"></textarea>
      <button class=iconbtn id=later title="Send later — at a time you choose, once or every day">⏱</button>
      <button class=sendbtn id=send>Send</button>
      <button class=stopbtn id=stopgen style="display:none">Stop</button>
    </div>
    <div class=hint><span id=modehint></span><span id=keyhint>Enter send · Shift+Enter newline</span><span id=tools></span><span class=qhelp id=qhelp title="keyboard shortcuts">? for shortcuts</span></div>
  </div></div>
  <div class=termdock id=termdock style="display:none"><div class=termgrip id=termgrip title="drag to resize"></div>
    <div class=termbar id=termbar></div><div class=termbody id=termbody></div></div>
</main>
<input type=file id=file multiple hidden>
<div id=modalhost></div>

<script src="/app.js"></script>
<script src="/app2.js"></script>
<script src="/app3.js"></script>
<script src="/app4.js"></script>
</body>
</html>
