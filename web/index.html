}
.ctxmenu{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:10px;
 box-shadow:0 10px 34px rgba(0,0,0,.22);padding:5px;min-width:186px;z-index:100;font-size:13.5px}

.ctxmenu .danger{color:var(--err)}

.ctxmenu .sub{margin-left:auto;color:var(--dim);font-size:11px}
.sources{margin:9px 0 4px;border-left:2px solid var(--ok);padding-left:11px}
.sources summary{cursor:pointer;color:var(--ok);font-size:12.5px;list-style:none}
.sources summary::-webkit-details-marker{display:none}
.sources .s{font-size:12.5px;color:var(--mut);margin:6px 0}
.sources .s b{color:var(--fg);font-weight:600}
.weak{margin:8px 0;border-left:2px solid var(--warn);padding:7px 11px;border-radius:0 7px 7px 0;
 background:color-mix(in srgb,var(--warn) 8%,transparent);font-size:12.5px}
.weak b{color:var(--warn);display:block;margin-bottom:4px}
.weak div{color:var(--mut);margin:3px 0}
.hintbar{font-size:12.5px;color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);
 border-radius:7px;padding:6px 11px;margin:6px 0;cursor:pointer}
.diff{margin:7px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px}
.diff .dh{background:var(--panel);padding:5px 10px;color:var(--mut);display:flex;gap:9px}
.diff .dh b{color:var(--fg)}
.diff .add{color:var(--ok)}.diff .del{color:var(--err)}
.diff pre{margin:0;padding:8px 10px;overflow-x:auto;font-family:var(--mono);max-height:280px}
.diff pre{padding:4px 0}
.diff pre span{display:block;padding-right:10px;white-space:pre}
.diff pre .a{background:color-mix(in srgb,var(--ok) 13%,transparent)}
.diff pre .d{background:color-mix(in srgb,var(--err) 13%,transparent)}
.diff pre .h{color:var(--dim);background:var(--panel);padding-left:10px}
.diff pre i{font-style:normal;user-select:none;-webkit-user-select:none}
.diff pre .ln{display:inline-block;min-width:3.2em;padding:0 8px 0 6px;text-align:right;color:var(--dim)}
.diff pre .sg{display:inline-block;width:1.2em;color:var(--dim)}
.diff pre .a .sg{color:var(--ok)}.diff pre .d .sg{color:var(--err)}
.working{color:var(--mut);font-size:13.5px}
.working .dots:after{content:'';animation:dt 1.2s steps(4,end) infinite}
@keyframes dt{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.think.live{border-left-color:var(--acc)}
.think.live summary{color:var(--acc)}
.think.live .body{max-height:260px;overflow-y:auto}   /* only while it streams; finished thinking shows in full */
/* long thinking, long messages: a few lines and a "Show all", as in Claude's app */
.clamped{max-height:calc(var(--clampl,12) * 1.55em);overflow:hidden;
 -webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}

.msg.u .clampbtn{margin-top:4px}
/* a subagent at work, under the Agent row that started it */
.tsubs{margin:2px 0 2px 18px;font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.tsubl{display:flex;gap:7px;line-height:1.55;min-width:0}
.tsubl .tarr{width:12px;flex:none;color:var(--dim)}
.tsubl span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsubl.dim{color:var(--dim)}
.tsubmeta{color:var(--dim);font-size:11px;margin-left:auto;margin-right:6px;white-space:nowrap}
.tsubsteps{margin:3px 0 7px 18px;padding:6px 9px;background:var(--panel);border-radius:6px;font-family:var(--mono);font-size:11.5px}
.tsubsteps .tsubhd{color:var(--dim);margin-bottom:3px;font-family:inherit}
.tsubsteps .tsubl .tarr{color:var(--tool)}
.tsubsteps pre.tsubsum{margin:6px 0 0;background:none;padding:0;max-height:220px}
details.tool.bgrun .tdot{color:var(--think);animation:bgpulse 1.6s ease-in-out infinite}
@keyframes bgpulse{50%{opacity:.35}}
#bgchip{display:none;margin-left:8px;color:var(--acc);cursor:pointer;font-weight:500}
#bgchip:hover{text-decoration:underline}
.think .body .tstamp{display:block;color:var(--dim);font-size:10.5px;margin:8px 0 1px;font-variant-numeric:tabular-nums}
.think .body .tstamp:first-child{margin-top:0}
.planbox{margin:8px 0;border:1px solid var(--line);border-radius:9px;background:var(--card);
 padding:9px 12px;font-size:13px}
.planbox b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
 display:block;margin-bottom:6px}
.planbox .st{display:flex;gap:8px;align-items:flex-start;margin:3px 0}
.planbox .st .bx{color:var(--dim)}
.planbox .st.done .bx{color:var(--ok)}
.planbox .st.done span{color:var(--dim);text-decoration:line-through}
.limitbox{margin:9px 0;border:1px solid var(--warn);border-radius:9px;padding:10px 12px;
 background:color-mix(in srgb,var(--warn) 8%,transparent);font-size:13px}
.limitbox b{color:var(--warn);display:block;margin-bottom:5px}
.limitbox button{margin-top:8px;background:var(--acc);color:#fff;border:0;border-radius:8px;
 padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.sitem .spin{width:9px;height:9px;border-radius:50%;border:2px solid var(--acc);
 border-top-color:transparent;animation:sp .8s linear infinite;flex:0 0 9px}
@keyframes sp{to{transform:rotate(360deg)}}
.sitem.st-run .t{color:var(--fg)}
.staleBar{position:fixed;top:0;left:0;right:0;z-index:120;background:var(--warn);color:#1a1a1a;
 padding:7px 14px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:center}
.staleBar button{background:#1a1a1a;color:#fff;border:0;border-radius:7px;padding:4px 12px;
 font:inherit;font-size:12.5px;cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);
 border:1px solid var(--line);border-radius:9px;padding:8px 15px;font-size:13px;
 box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:90}
.sitem .unseen{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:0 0 7px}
details.tool{white-space:normal;overflow:hidden;padding:0;background:none;margin:1px 0;
 color:var(--fg);font-size:13px;font-family:inherit;border-radius:0}
details.tool summary{list-style:none;cursor:pointer;padding:2px 0 2px 2px}
details.tool summary::-webkit-details-marker{display:none}
.thead{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.tdot{color:var(--tool);flex:0 0 auto;font-size:10px;line-height:1.7}
details.tool.done .tdot{color:var(--ok)}details.tool.bad .tdot{color:var(--err)}
details.tool .tn{font-weight:600;flex:0 0 auto}
details.tool .tl{color:var(--mut);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
 font-family:var(--mono);font-size:11.5px}
details.tool .tt{color:var(--dim);font-size:11px;flex:0 0 auto}
details.tool .tt.bad{color:var(--err)}
/* the ⎿ line: what the call gave back, in one phrase, always visible */
.tres{display:flex;gap:7px;color:var(--mut);font-size:12px;margin:1px 0 0 3px;white-space:nowrap}
.tres .tsum{font-family:var(--mono);font-size:11.5px}
details.tool summary:hover .tn{color:var(--acc)}
details.tgroup>summary:hover .tn{color:var(--acc)}
.tres .tarr{color:var(--dim);flex:0 0 auto}
.tres .tsum{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tres,.thead{min-width:0;overflow:hidden}
details.tool,details.tgroup,details.tool summary{min-width:0;max-width:100%}
.tres.bad .tsum{color:var(--err)}
details.tool[open] .tres .tarr{opacity:.55}
.tool .spin{width:9px;height:9px;border-radius:50%;border:2px solid var(--tool);
 border-top-color:transparent;animation:sp .8s linear infinite;flex:0 0 9px;align-self:center}
details.tool pre,details.tool .targs{margin:3px 0 7px 18px;padding:6px 9px;background:var(--panel);
 border-radius:6px;white-space:pre-wrap;word-break:break-word;color:var(--fg);font-size:11.5px;
 line-height:1.5;max-height:340px;overflow:auto;font-family:var(--mono)}
details.tool .targs{color:var(--mut);margin-bottom:3px}
details.tool .more{display:inline-block;margin:0 0 7px 18px;color:var(--acc);cursor:pointer;font-size:11px}
/* several finished reads/searches in a row read as one line, as in Claude Code */
details.tgroup{margin:1px 0}
details.tgroup>summary{list-style:none;cursor:pointer;display:flex;gap:7px;align-items:baseline;
 padding:2px 0 2px 2px;font-size:12.5px}
details.tgroup>summary::-webkit-details-marker{display:none}
details.tgroup>summary .tn{font-weight:600}
details.tgroup>summary .tt{color:var(--dim);font-size:11px;margin-left:auto}
details.tgroup .tgbody{margin-left:16px;border-left:1px solid var(--line);padding-left:9px}
#log.hidedone details.tool.done,#log.hidedone details.tgroup{display:none}
.who .bystat{text-transform:none;letter-spacing:0;color:var(--dim)}
/* while it works: a spinner, what it is doing, how long, and how to stop it */
.statusline{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--mut);
 margin:0 0 7px;padding:0 3px;white-space:nowrap;overflow:hidden}
.statusline .sspin{color:var(--acc);font-family:var(--mono);width:10px;display:inline-block}
.statusline .sverb{color:var(--fg)}
.statusline .smeta{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.statusline .sint{color:var(--dim);margin-left:auto;cursor:pointer}
.statusline .sint:hover{color:var(--err)}
/* rewind and history sheets */
.sheetnote{color:var(--mut);font-size:12.5px;margin:0 0 9px}
.rewrow{display:flex;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.rewtext{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rewacts{display:flex;gap:6px;flex:0 0 auto}
.histrow{padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.histrow:hover{background:var(--panel)}
.sfilter{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
 background:var(--card);color:var(--fg);font:inherit;margin-bottom:8px}
/* the context grid behind /context */
.ctxgrid{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:4px 0 12px}
.ctxcell{aspect-ratio:1;border-radius:2px;display:block}
.ctxlist{margin-bottom:8px}
.ctxrow{display:flex;gap:9px;align-items:center;font-size:13px;padding:3px 2px}
.ctxdot{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.ctxname{flex:1}.ctxval{color:var(--mut);font-size:12px}
.cmdrow{display:flex;gap:10px;align-items:baseline;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:13px}
.cmdrow:hover{background:var(--panel)}
.cmdrow code{font-family:var(--mono);color:var(--acc);font-size:12.5px;flex:0 0 auto;min-width:118px}
.cmdrow span{color:var(--mut)}
/* One answer, one block: the steps after the first (more text after tools) carry on
   under the same heading instead of repeating the model's name, as in Claude Code */
.msg.a.cont{margin-top:-12px}
.msg.a.cont>.who{position:absolute;right:0;top:-14px;margin:0;z-index:1;opacity:0;transition:opacity .15s}
.msg.a.cont:hover>.who{opacity:1}
/* the step that carries the answer's time and tokens keeps them in view */
.msg.a.cont:not(:has(+ .msg.a.cont))>.who:has(.bystat:not(:empty)){position:static;opacity:1;justify-content:flex-end;margin-bottom:1px}
/* time and tokens once per answer, on its last step, as Claude Code reports a turn */
.msg.a:has(+ .msg.a.cont)>.who .bystat{display:none}
.msg.a.cont>.who .byline{display:none}
.msg.a.cont>.who .bystat{opacity:.8}
/* ! shell mode: the box turns shell-coloured, and a run shows as a terminal block */
textarea.bangmode{outline:2px solid var(--tool)!important;font-family:var(--mono)}
textarea.memmode{outline:2px solid var(--think)!important}
.bangbox{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.bangcmd{font-family:var(--mono);font-size:12.5px;padding:7px 12px;color:var(--tool);
 border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.bangout{margin:0;padding:8px 12px;font-family:var(--mono);font-size:12px;max-height:320px;

.bangmeta{font-size:11px;color:var(--dim);padding:4px 12px}
.bangbox.bad .bangmeta{color:var(--err)}
#modehint{font-weight:500}

.qhelp{margin-left:auto;cursor:pointer}.qhelp:hover{color:var(--acc)}
.shortcuts .kgroup{grid-column:1/-1;margin-top:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.planbox .st.active span:last-child,.plandock .st.active span:last-child{font-weight:600}
.planbox .st .bx,.plandock .st .bx{font-family:var(--mono)}
.planbox .st.active .bx,.plandock .st.active .bx{color:var(--acc)}

.approve.ccask{border:1px solid color-mix(in srgb,var(--acc) 55%,var(--line));border-radius:11px;
 padding:11px 14px 9px;background:var(--card)}
.ccttl{font-weight:600;font-size:13px;color:var(--acc);margin-bottom:6px}
.ccwhat{border-left:2px solid var(--line);padding-left:10px;margin:0 0 8px}
.ccmain{margin:0;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word;
 background:none!important;padding:0!important;max-height:220px;overflow:auto}
.ccdesc{color:var(--mut);font-size:12.5px;margin-top:3px}
.ccargs summary{cursor:pointer;color:var(--dim);font-size:11.5px;margin-top:4px}
.ccargs pre{font-size:11.5px}
.ccwhy{color:var(--mut);font-size:12px;margin:0 0 6px}
.ccq{font-size:13px;margin:4px 0 5px}

.hero{max-width:780px;margin:7vh auto 40px;padding:0 18px;text-align:center}
.herot{font-size:27px;font-weight:500;letter-spacing:-.015em;color:var(--fg)}

.hch .hdot{width:7px;height:7px;border-radius:50%;background:var(--dim)}.hch .hdot.live{background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:hpulse 1.8s infinite}

.hlist{display:flex;flex-direction:column;gap:2px}

function notebookView(nb){

 (nb.cells||[]).forEach((c,i)=>{
  const cell=el(`<div class="nbcell ${c.cell_type}"><div class=nbin></div></div>`);
  if(c.cell_type==='markdown'){cell.querySelector('.nbin').innerHTML=md(src(c.source))}
  else if(c.cell_type==='code'){cell.querySelector('.nbin').innerHTML=`<div class=nbnum>[${esc(c.execution_count??' ')}]</div>`+codeHtml(src(c.source),lang);
   (c.outputs||[]).forEach(o=>{const out=el('<div class=nbout></div>');
    const data=o.data||{};
    if(data['image/png']||data['image/jpeg']){const i=document.createElement('img');i.className='mdimg';
     const kind=data['image/png']?'png':'jpeg';i.src=`data:image/${kind};base64,`+src(data['image/'+kind]).replace(/[^A-Za-z0-9+/=]/g,'');out.appendChild(i)}

    else if(o.output_type==='error'){const pre=document.createElement('pre');pre.className='err';pre.textContent=(o.ename||'')+': '+(o.evalue||'');out.appendChild(pre)}
    cell.appendChild(out)})}
  else{const pre=document.createElement('pre');pre.textContent=src(c.source);cell.querySelector('.nbin').appendChild(pre)}
  box.appendChild(cell)});
 return box}

function cleanForCopy(root){
 const x=root.cloneNode(true);
 x.querySelectorAll('.codehead,.blktools,.codemore,.filestrip,.imgbar,button,.tmeta').forEach(n=>n.remove());
 x.querySelectorAll('.pathlink,.pathcand').forEach(n=>{n.removeAttribute('title');n.removeAttribute('class')});
 x.querySelectorAll('.codeblk').forEach(b=>{b.removeAttribute('class');b.setAttribute('style','margin:6px 0')});
 x.querySelectorAll('pre').forEach(p=>p.setAttribute('style','font-family:Menlo,Consolas,monospace;font-size:10pt;background:#f5f5f5;padding:8px;border-radius:4px;white-space:pre-wrap'));
 x.querySelectorAll('code').forEach(c=>{if(!c.closest('pre'))c.setAttribute('style','font-family:Menlo,Consolas,monospace;background:#f2f2f2;padding:0 3px;border-radius:3px')});
 x.querySelectorAll('table').forEach(t=>{const h=tableHtmlForCopy(t);const w=document.createElement('div');w.innerHTML=h;t.replaceWith(w.firstChild)});
 x.querySelectorAll('.callout').forEach(c=>c.setAttribute('style','border-left:3px solid #888;padding:4px 10px;margin:6px 0'));
 x.querySelectorAll('.mathblock').forEach(k=>{const m=k.querySelector('math');const d=document.createElement('div');d.appendChild(m?m.cloneNode(true):document.createTextNode(k.textContent));k.replaceWith(d)});
 x.querySelectorAll('.katex').forEach(k=>{const m=k.querySelector('math');k.replaceWith(m?m.cloneNode(true):k.textContent)});
 x.querySelectorAll('img').forEach(i=>{if(i.getAttribute('src')&&!/^(data:|https?:)/.test(i.getAttribute('src')))i.src=new URL(i.getAttribute('src'),location.href).href});

function todoify(node){
 node.querySelectorAll('ul:not([data-todo])').forEach(ul=>{
  const items=[...ul.querySelectorAll('li')];
  if(!items.length)return;
  const boxy=items.filter(li=>/^\s*\[( |x|X)\]\s/.test(li.textContent));
  if(boxy.length<items.length||!boxy.length)return;
  ul.dataset.todo='1';ul.style.listStyle='none';ul.style.paddingLeft='2px';
  items.forEach(li=>{
   const done=/^\s*\[(x|X)\]/.test(li.textContent);
   const text=li.textContent.replace(/^\s*\[( |x|X)\]\s*/,'');
   li.innerHTML='';
   const cb=document.createElement('input');cb.type='checkbox';cb.checked=done;
   cb.style.marginRight='8px';cb.style.accentColor='var(--acc)';

let livePoll=null;

function attachLive(theSid, initial){
 stopLive();
 const note=sysline('still generating — reconnected to it');
 let a=addAssistant(modelLabel());
 a.bub.innerHTML='<span class=working>rejoining this answer<span class=dots></span></span>';
 startStatus();let seenChars=0,seenThink=0,sinceSet=false;
 // shownTools counts lv.tools already drawn -- not a.tools' children, which
 // also hold approval boxes, so one approval used to swallow the next tool
 let thinkStarted=false, shownApproval=null, shownTools=0, step=null;
 let lrows=[];
 const paint=lv=>{
  // the server keeps only the step being written; when it moves on to the
  // next one, close this block and start another, as a live answer does
  if(step!==null&&lv.step!=null&&lv.step!==step){
   lrows.forEach(r=>{if(r.classList.contains('live'))finishTool(r,{})});
   if(thinkStarted)thinkLabel(a,'thought');
   if(a.bub.dataset.raw)decorate(a.bub);else a.bub.remove();
   a=addAssistant(modelLabel());thinkStarted=false;shownTools=0;lrows=[];seenChars=0;seenThink=0}
  if(lv.step!=null)step=lv.step;
  // the status line counts from when the answer began, not from when this window joined
  if(!sinceSet&&lv.since){sinceSet=true;statusT0=lv.since*1000}
  if(!lv.content&&!lv.thinking&&lv.status)
   a.bub.innerHTML='<span class=working>'+esc(lv.status)+'<span class=dots></span></span>';
  // the status line counts what has come back since you rejoined
  if(lv.status)statusSay(lv.status);
  {const c=(lv.content||'').length,th=(lv.thinking||'').length;
   if(th>seenThink){statusGrew('',true);statusChars+=th-seenThink;seenThink=th}
   if(c>seenChars){statusGrew('',false);statusChars+=c-seenChars;seenChars=c}
}
  const tl=lv.tools||[];
  tl.slice(shownTools).forEach(t=>{
   const auto=(t.name||'').startsWith('✓ auto-approved: ');
   let c;
   if(t.id&&!auto){c=toolRow(t,t.ok!=null);if(t.t&&c.classList.contains('live'))c._t0=t.t*1000}
   else{const name=auto?t.name.slice('✓ auto-approved: '.length):t.name;
    const args='('+Object.entries(t.args||{}).map(([k,v])=>k+'='+String(v).slice(0,60)).join(', ')+')';
    c=el(auto?'<div class=autoappr></div>':'<div class=tool></div>');
    c.textContent=(auto?'✓ auto-approved — ':'* ')+name+args}
   lrows.push(c);a.tools.appendChild(c);if(c.classList.contains('done'))groupTool(c,0,true)});
  shownTools=tl.length;
  tl.forEach((t,i)=>{const r=lrows[i];if(r&&r.classList.contains('live')&&t.ok!=null){finishTool(r,t);groupTool(r,0,true)}});
  // subagents at work, as the answering tab shows them (their last few steps)
  Object.entries(lv.subagents||{}).forEach(([pid,sa])=>{
   const i=tl.findIndex(t=>t.id===pid);const r=lrows[i];
   if(!r||!r.classList.contains('live')||r._seenSub===sa.tools)return;
   r._seenSub=sa.tools;
   const last=(sa.last||[]).map(st=>({name:st.name,args:st.args}));
   r._steps=Array(Math.max(0,(+sa.tools||0)-last.length)).fill({name:'tool'}).concat(last);
   drawSub(r,sa)});
  Object.values(lv.bgtasks||{}).forEach(b=>bgNote(theSid,b));
  if(lv.question&&lv.question.id!==a._q){a._q=lv.question.id;a.tools.appendChild(questionBox(lv.question))}
  // an approval waiting in this chat, raised by a stream some other tab owns
  if(lv.approval&&lv.approval.id!==shownApproval){
   shownApproval=lv.approval.id;a.tools.appendChild(approvalBox(lv.approval));
   notify(theSid,'Needs your approval',lv.approval.name||'')}
  if(lv.thinking){
   const body=a.think.querySelector('.body');
   if(!thinkStarted){thinkStarted=true;body._stick=true;a.think.style.display='';a.think._at=clockTime();
    thinkLabel(a,'thinking');openThink(a)}
   // while it is written it keeps to a small box (the newest lines), as in a live answer;
   // once text follows it folds like any finished thinking
   if(lv.content||(lv.tools||[]).length){if(a.think.classList.contains('live')){a.think.classList.remove('live');
     thinkLabel(a,'thought')}clampLong(body,lv.thinking,12)}
   else a.think.classList.add('live');
   renderThink(body,lv.thinking,lv.thinking_marks);
   if(body._stick)body.scrollTop=body.scrollHeight}        // only if you're not reading back
  if(lv.content){a.bub.innerHTML=md(lv.content);a.bub.dataset.raw=lv.content}
  bottom()};
 paint(initial||{});
 livePoll=setInterval(async()=>{
  if(sid!==theSid){stopLive();stopStatus(theSid);return}          // user moved on again
  try{
   const lv=await (await fetch('/api/live/'+theSid)).json();
   if(!lv.known){stopLive();stopStatus(theSid);return}
   paint(lv);
   if(!lv.running){
    stopLive(); note.remove(); stopStatus(theSid);
    lrows.forEach(r=>{if(r.classList.contains('live'))finishTool(r,{stopped:true})});
    if(lv.content){a.bub.innerHTML=md(lv.content);decorate(a.bub)}
    RUNNING.delete(theSid);renderSessions();loadSessions();

    setTimeout(()=>afterTurn(theSid),300);
   }
  }catch(e){stopLive();stopStatus(theSid)}
 },800);
}

let menu=null,msel=0;

function allCmds(){return CMDS.concat(Object.keys(PROMPTS).map(n=>({c:'/'+n,d:PROMPTS[n].desc||'saved prompt',p:1})))
 .concat(isClaudeChat()?CQ_CMDS.filter(x=>!CMDS.some(c=>c.c===x.c)):[])}
function showMenu(){
 closeMenu();const t=q.value;if(!t.startsWith('/'))return;
 // commands that start with what you typed first, then ones that contain it, then ones
 // whose description does -- so /ctx still finds /context, as Claude Code's menu does
 if(t.includes(' '))return;
 const w=t.toLowerCase(),all=allCmds();
 const seen=new Set(),hits=[];
 const add=c=>{if(!seen.has(c.c)){seen.add(c.c);hits.push(c)}};
 all.filter(c=>c.c.toLowerCase().startsWith(w)).forEach(add);
 if(w.length>1){all.filter(c=>c.c.toLowerCase().includes(w.slice(1))).forEach(add);
  all.filter(c=>(c.d||'').toLowerCase().includes(w.slice(1))).forEach(add);
  // letters in order: /ctx -> /context
  const re=new RegExp('^/'+w.slice(1).split('').map(ch=>ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('.*'));
  all.filter(c=>re.test(c.c.toLowerCase())).forEach(add)}
 if(!hits.length)return;
 hits.splice(14);
 msel=Math.min(msel,hits.length-1);
 menu=el('<div class=menu></div>');
 hits.forEach((c,i)=>{const d=el(`<div class="${i===msel?'sel':''}"><code>${c.c}</code><small>${esc(c.d)}</small></div>`);
  d.onclick=()=>{if(c.p){q.value=PROMPTS[c.c.slice(1)].text;closeMenu();q.focus();return}
   if(c.cc){q.value=c.c+' ';closeMenu();q.focus();return}      // Claude Code's own command or skill
   q.value=c.c+' ';closeMenu();q.focus();
   if(!['/remember','/rename'].includes(c.c))runCmd(c.c,'')};

// estimated from what went through Orbit (OpenCode Go publishes allowances, not balances)
function usageShort(u){
 if(!u||!u.windows||!u.requests)return '';          // nothing used through Orbit yet

 // the allowance is the account's, shared by all models (shown with the account); per model, what it used

// OpenCode Go's own figures for an account: what is left of the 5-hour, weekly and monthly allowance
function liveShort(l){
 if(!l||l.error||!l.rolling)return '';
 const left=w=>Math.max(0,100-(l[w].percent||0));
 return ` — ${left('rolling')}% 5h · ${left('weekly')}% wk · ${left('monthly')}% mo left`}
function liveLong(l){
 if(!l)return '';
 if(l.error)return 'usage unavailable ('+l.error+')';
 const row=(n,w)=>l[w]?`${n}: ${Math.max(0,100-(l[w].percent||0))}% left${l[w].status==='rate-limited'?' (limit reached)':''}, resets ${new Date(l[w].resetsAt).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`:'';
 return [row('5 hours','rolling'),row('week','weekly'),row('month','monthly')].filter(Boolean).join(' · ')}
function usageLong(u){
 if(!u||!u.windows)return '';
 const w=u.windows,row=(n,k)=>w[k]?`${n}: $${w[k].spent.toFixed(2)}${w[k].allowance!=null?` of $${w[k].allowance} (${w[k].left_pct}% left)`:''}`:'';
 return [row('5 hours','5h'),row('week','week'),row('month','month')].filter(Boolean).join(' · ')+(u.account?` — ${u.account}`:'')}

 const s_=sid;

 try{lv=await (await fetch('/api/live/'+encodeURIComponent(s_))).json()}
 catch(e){return true}                       // the Mac is unreachable: keep it safe, queue it

// "21:30", "9pm", "tomorrow 9am", "in 2h", "in 45m", "mon 8:00", "daily 8:00", "weekdays 9am"
function parseLater(s){
 s=String(s||'').trim();let m,repeat=null,at=null;
 const now=new Date();
 if((m=s.match(/^(daily|every\s*day|weekdays|weekly)\s+/i))){repeat=/week(ly)$/i.test(m[1])?'weekly':/weekdays/i.test(m[1])?'weekdays':'daily';s=s.slice(m[0].length)}
 if((m=s.match(/^in\s+(\d+(?:\.\d+)?)\s*(m|min|mins|minutes?|h|hr|hrs|hours?|d|days?)\b\s*/i))){
  const n=parseFloat(m[1]),u=m[2][0].toLowerCase();at=new Date(now.getTime()+n*(u==='m'?6e4:u==='h'?36e5:864e5));s=s.slice(m[0].length)}
 else{
  let day=null;
  if((m=s.match(/^(today|tonight|tomorrow|tmr|mon|tue|wed|thu|fri|sat|sun)[a-z]*\s+/i))){day=m[1].toLowerCase();s=s.slice(m[0].length)}
  if(!(m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b\s*/i)))return null;
  if(!m[2]&&!m[3])return null;
  let h=+m[1],mi=+(m[2]||0);const ap=(m[3]||'').toLowerCase();
  if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;if(h>23||mi>59)return null;
  s=s.slice(m[0].length);
  at=new Date(now);at.setHours(h,mi,0,0);
  const wd=['sun','mon','tue','wed','thu','fri','sat'];
  if(day==='tomorrow'||day==='tmr')at.setDate(at.getDate()+1);
  else if(day&&wd.includes(day.slice(0,3))){const want=wd.indexOf(day.slice(0,3));let add=(want-at.getDay()+7)%7;if(add===0&&at<=now)add=7;at.setDate(at.getDate()+add)}
  else if(at<=now)at.setDate(at.getDate()+1)}
 return {at:at.getTime()/1000,repeat,text:s.trim()}}

     if(m.p.error)w.title=String(m.p.error);
     a.tools.appendChild(w);bottom()}
    else if(m.k==='stream_error'){
     // shown by the retry note; an older server sends no retry event, so say it here
     if(m.p.of==null)sysline(`the model server errored (${m.p.error}) — retrying, attempt ${m.p.attempt}`)}
    else if(m.k==='notice'){
     // Claude Code's hooks report on every step; they fold into one line per answer
     if(/^hook\s/i.test(m.p.msg||'')){hookNote(sendSid,m.p.msg);continue}
     if(m.p.kind==='limit'){const b=el('<div class="injwarn limitnote"></div>');b.textContent='\u23f8 '+(m.p.msg||'');
      a.m.appendChild(b);bottom();notify(sendSid,'Usage limit',m.p.msg||'');continue}
     sysline(m.p.msg||'')}
    else if(m.k==='status'){const w=a.bub.querySelector('.working');
     statusSay(m.p.msg||'');
     if(w&&!answer)a.bub.innerHTML='<span class=working>'+esc(m.p.msg||'working')+'<span class=dots></span></span>'}
    else if(m.k==='squeezed'){
     sysline(`trimmed ${Math.round(m.p.chars/1000)}k of old tool output — context now ${m.p.pct}%`)}
    else if(m.k==='autocompact'){
     sysline(`context ${m.p.pct}% full — compacting automatically (threshold ${m.p.limit}%)`)}
    else if(m.k==='autocompact_done'){
     sysline(`compacted ${m.p.before} → ${m.p.after} messages`)}
    else if(m.k==='error'){const e=el('<div class=err></div>');e.textContent=m.p;a.m.appendChild(e);
     errored=true;notify(sendSid,'Error',String(m.p))}
    else if(m.k==='end'){endP=m.p||{};if(m.p&&m.p.title&&sid===sendSid){
     $('#title').textContent=m.p.title; if(m.p.sid)sid=m.p.sid}}
   }}
  if(queuedBy){SENDING.delete(sendSid);stopStatus(sendSid);await refreshRunning();syncBusy();renderSessions();return}
  if(pendingRender){clearTimeout(pendingRender);pendingRender=null}
  // thinking that came after the answer's text is folded too, now that it is done
  a.m.querySelectorAll('details.think .body').forEach(b=>{if(!b.classList.contains('clamped'))clampLong(b,b.textContent,12)});
  setTimeout(pollBg,1200);             // background work it left running shows at once
 if(thinkPending){clearTimeout(thinkPending);thinkPending=null;
  renderThink(a.think.querySelector('.body'),thinking,tmarks)}
 if(thinking&&!answer){a.think.classList.remove('live');thinkLabel(a,thoughtFor())}
 if(!answer)a.bub.textContent=(stoppedSid===sendSid)?'(stopped before it wrote anything)'
                                            :'(no answer)';

 answerStats(a,endP&&endP.secs!=null?endP.secs:(performance.now()-t0)/1000,endP&&endP.usage);
 if(endP&&(endP.changes||[]).length&&endP.t)undoButton(a,endP.t,endP.changes.length);
 if(stoppedSid!==sendSid&&!errored)
  notify(sendSid,'Answer ready',answer.replace(/\s+/g,' ').trim().slice(0,160)||'(no answer)');
 }catch(e){a.bub.innerHTML='';const x=el('<div class=err></div>');x.textContent='Error: '+e;a.m.appendChild(x);
  notify(sendSid,'Error',String(e))}
 Object.values(trows).forEach(r=>{if(r.classList.contains('live')){finishTool(r,{stopped:true});groupTool(r)}});
 stopStatus(sendSid);
 RUNNING.delete(sendSid); SENDING.delete(sendSid); renderSessions(); syncBusy();
 PENDING_NOTES.filter(x=>!x.done&&x.sid===sendSid).forEach(x=>{x.done=true;

 $('#dot').classList.remove('busy');loadSessions();refreshStatus();q.focus();

// A chat can change under you -- a message sent from the phone, or another
// window. Ask the Mac for a cheap stamp of the open chat every few seconds and
// re-read it when the count moves; join an answer someone else started.
let WATCH_N=null, WATCH_SID=null, WATCH_GONE=null;
async function watchOpenChat(){
 // a temporary chat has no file to stamp, and a chat that 404s once (deleted,
 // or never saved) is not polled again -- both used to 404 every 3 seconds
 if(!sid||tempMode||sid===WATCH_GONE||busy||SENDING.has(sid)||livePoll||switching||document.hidden)return;
 try{
  const st=await (await fetch('/api/stamp/'+sid)).json();
  if(st.error){WATCH_GONE=sid;return}
  if(WATCH_SID!==sid||WATCH_N===null){WATCH_SID=sid;WATCH_N=st.n;return}   // no baseline yet
  if(st.n!==WATCH_N||st.running){
   WATCH_N=st.n;
   const typing=q.value, hadFocus=document.activeElement===q;  // keep what you were typing
   await openSession(sid);
   q.value=typing; if(hadFocus)q.focus();
  }
 }catch(e){}
}

// the model picker's choices, grouped, for a scheduled task ("" = the chat's / the default)
function modelOptions(cur,emptyLabel,only){
 const groups={};(MODELS.models||[]).filter(m=>!m.switch&&(!only||only(m.id))).forEach(m=>{(groups[m.provider_label]=groups[m.provider_label]||[]).push(m)});
 const known=(MODELS.models||[]).some(m=>m.id===cur);
 return `<option value="">${esc(emptyLabel||'default model')}</option>`+(cur&&!known?`<option value="${esc(cur)}" selected>${esc(cur)}</option>`:'')+Object.entries(groups).map(([g,list])=>
  `<optgroup label="${esc(g)}">${list.map(m=>`<option value="${esc(m.id)}"${m.id===cur?' selected':''}>${esc(m.label||m.model)}${m.ready===false?' — needs a key':''}${esc(opSuffix(m.offpeak))}</option>`).join('')}</optgroup>`).join('')}
// Cheaper hours (bin/offpeak.py): a model's discount window, as a coloured mark in menus
function opLive(op){
 // the server's state may be minutes old: flip it by the window's own times
 if(!op)return null;const now=Date.now()/1000;
 if(op.active&&op.ends_at&&now>=op.ends_at)return {...op,active:false,stale:true};
 if(!op.active&&op.starts_at&&typeof op.starts_at==='number'&&now>=op.starts_at)return {...op,active:true,stale:true};
 return op}
function opTime(ts){return new Date(ts*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
// "3:00 AM", or "Mon 3:00 AM" when it is not today
function opWhen(ts){const d=new Date(ts*1000);return (d.toDateString()===new Date().toDateString()?'':d.toLocaleDateString([], {weekday:'short'})+' ')+opTime(ts)}
function opSuffix(op){op=opLive(op);if(!op)return '';
 return op.active?` · 🟢 ${op.what} now`:` · 🟠 ${op.what}${op.starts_at&&typeof op.starts_at==='number'?' from '+opWhen(op.starts_at):' at set hours'}`}
function drawOffpeak(){
 const b=$('#opbadge');if(!b)return;
 const cur=MODELS.current||MODELS.default||'';
 const m=(MODELS.models||[]).find(x=>x.id===cur);
 const op=opLive(m&&m.offpeak);
 if(!op){b.style.display='none';return}
 b.style.display='';b.className='opbadge '+(op.active?'on':'later');
 b.textContent=op.active?`🟢 ${op.what}${op.ends_at?' · until '+opWhen(op.ends_at):''}`:`🟠 ${op.quota?'full rate':'peak price'}${op.starts_at&&typeof op.starts_at==='number'?' · '+op.what+' from '+opWhen(op.starts_at):''}`;
 b.title=`Cheaper hours for ${m.label||m.model}: ${(op.windows_local||[]).join(', ')} your time (${(op.windows||[]).join(', ')}) — click for details`;
 if(op.stale&&!drawOffpeak._reloading){drawOffpeak._reloading=true;setTimeout(async()=>{await loadModels();drawOffpeak._reloading=false},1500)}}
setInterval(drawOffpeak,60000);
async function showOffpeak(){
 let d;try{d=await (await fetch('/api/offpeak')).json()}catch(e){return}
 const cur=MODELS.current||MODELS.default||'';const m=(MODELS.models||[]).find(x=>x.id===cur);
 openSheet('Cheaper hours',body=>{
  const pols=d.policies||[];
  const frac=v=>typeof v==='number'?`${Math.round((1-v)*100)}% off`:'';
  const parts=disc=>Object.entries(disc||{}).map(([k,v])=>k==='quota_multiplier'?`requests count ${v}× against the plan`:`${k.replace(/_/g,' ')}: ${frac(v)}`).join(' · ');
  body.innerHTML=`<div class=note style="margin-bottom:8px">Some providers charge less at certain hours, and some plans count less of your allowance then. It depends on <b>where</b> you use a model: DeepSeek through its own API or through OpenCode Go follows DeepSeek's hours, while the same model elsewhere may not. Models in the pickers are marked 🟢 while it is cheaper and 🟠 when it is cheaper at other hours. Times are shown in the provider's time zone and in yours.${m&&m.offpeak?'':' The model this chat uses has no cheaper hours.'}</div>`+
   (pols.length?'':'<div class=note>No provider in Orbit\'s list has time-based pricing on record.</div>');
  pols.forEach(p=>{const st=p.status||{};
   const box=el(`<details class=jobrow ${m&&m.id&&m.id.includes(':'+p.provider+'/')?'open':''}><summary style="cursor:pointer;display:flex;gap:8px;align-items:center"><span class="opdot ${st.active?'on':'later'}"></span><b></b><span class=sub style="margin-left:auto"></span></summary><div class=grid style="margin-top:8px"></div></details>`);
   box.querySelector('b').textContent=p.provider+(p.applies_to?' · '+p.applies_to:'');
   box.querySelector('.sub').textContent=st.label||'';

let pal=null,palSel=0,palItems=[];

async function openPal(){
 closePal();
 pal=el(`<div class=palette><input placeholder="Search chats, files, commands..."><div class=res></div></div>`);
 document.body.appendChild(pal);
 const inp=pal.querySelector('input'),res=pal.querySelector('.res');
 const draw=()=>{res.innerHTML='';
  palItems.slice(0,40).forEach((it,i)=>{
   const d=el(`<div class="it${i===palSel?' sel':''}"><span class=k></span><span class=t></span><span class=s></span></div>`);
   d.querySelector('.k').textContent=it.kind;
   d.querySelector('.t').textContent=it.label;
   d.querySelector('.s').textContent=it.sub||'';
   d.onclick=()=>{closePal();it.go()};res.appendChild(d)})};
 const build=async term=>{
  palItems=[];
  CMDS.filter(c=>!term||c.c.includes(term)).forEach(c=>palItems.push(
   {kind:'cmd',label:c.c,sub:c.d,go:()=>runCmd(c.c,'')}));
  SESSIONS.filter(s=>!term||(s.title||'').toLowerCase().includes(term)).slice(0,10)
   .forEach(s=>palItems.push({kind:'chat',label:s.title||'(untitled)',sub:s.n+' msgs',
    go:()=>{showPane('log');openSession(s.id)}}));
  if(term&&term.length>2){
   try{const hits=await (await fetch('/api/searchchats?q='+encodeURIComponent(term))).json();
    hits.slice(0,10).forEach(h=>palItems.push({kind:'in chat',label:h.snippet.trim().slice(0,70),
     sub:h.title,go:()=>{showPane('log');openSession(h.sid)}}))}catch(e){}
   try{const fd=await (await fetch('/api/files?limit=200')).json();
    (fd.items||[]).filter(f=>f.name.toLowerCase().includes(term)).slice(0,8)
     .forEach(f=>palItems.push({kind:'file',label:f.name,sub:f.area,
      go:()=>{showPane('files')}}))}catch(e){}}
  palSel=0;draw()};
 inp.oninput=()=>build(inp.value.trim().toLowerCase());
 inp.onkeydown=e=>{
  if(e.key==='Escape')return closePal();
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);draw()}
  if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);draw()}
  if(e.key==='Enter'){e.preventDefault();const it=palItems[palSel];if(it){closePal();it.go()}}};
 await build('');inp.focus();
 pal.addEventListener('click',e=>e.stopPropagation());
 setTimeout(()=>document.addEventListener('click',closePal,{once:true}),0);
}

   the shape Claude Code uses. */
const SPIN=['·','✢','✳','✶','✻','✽'];
const SPINSEQ=SPIN.concat(SPIN.slice(1,-1).reverse());
const VERBS=['Working','Pondering','Brewing','Churning','Cooking','Crunching','Percolating',

 'Noodling','Whirring','Mulling','Sifting','Assembling','Unravelling','Untangling','Composing'];
// how thinking is described as it goes on, the way Claude Code escalates it
const THINK_LADDER=[[45,'deep in thought'],[30,'thinking some more'],[20,'thinking more'],

let STATUS_SID=null,statusTimer=null,statusT0=0,statusVerb='',statusFrame=0,statusNote='',statusChars=0,statusThinkT0=0;
function startStatus(){
 document.body.classList.add('statuson');
 STATUS_SID=sid;statusT0=Date.now();statusVerb=VERBS[Math.floor(Math.random()*VERBS.length)];
 statusNote='';statusChars=0;statusThinkT0=0;statusFrame=0;
 const n=$('#statusline');if(!n)return;
 n.style.display='';drawStatus();
 if(!statusTimer)statusTimer=setInterval(drawStatus,140)}
function stopStatus(forSid){
 if(forSid&&STATUS_SID&&forSid!==STATUS_SID)return;     // another chat's answer owns the line now
 STATUS_SID=null;
 document.body.classList.remove('statuson');
 if(statusTimer){clearInterval(statusTimer);statusTimer=null}
 const n=$('#statusline');if(n){n.style.display='none';n.innerHTML=''}}

function fmtTok(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(n)}

 const n=$('#statusline');if(!n)return;
 if(STATUS_SID&&sid!==STATUS_SID){n.style.visibility='hidden';return}

 const secs=(Date.now()-statusT0)/1000;
 let verb=statusVerb;
 if(statusThinkT0){const t=(Date.now()-statusThinkT0)/1000;
  verb=(THINK_LADDER.find(([s])=>t>=s)||[0,'thinking'])[1];
  verb=verb.charAt(0).toUpperCase()+verb.slice(1)}

function diffBlock(D,label){
 const box=el('<div class=diff></div>');
 box.appendChild(el(`<div class=dh><b>${esc((D.path||'').split('/').pop())}</b>
   <span class=add>+${+D.added||0}</span><span class=del>−${+D.removed||0}</span>
   <span style="margin-left:auto;color:var(--dim)">${esc(label||(D.existed?'updated':'new file'))}</span></div>`));
 // each line with its number in the file, as Claude Code shows an edit: the new
 // number for added and unchanged lines, the old one for removed lines
 const pre=document.createElement('pre');
 let oldN=0,newN=0;
 String(D.diff||'').split('\n').forEach(l=>{
  if(l.startsWith('+++')||l.startsWith('---'))return;
  const hunk=l.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
  const sp=document.createElement('span');
  if(hunk){oldN=+hunk[1];newN=+hunk[2];sp.className='h';sp.textContent=l;pre.appendChild(sp);return}
  const kind=l.startsWith('+')?'a':l.startsWith('-')?'d':'';
  sp.className=kind;
  const num=el('<i class=ln></i>');
  if(kind==='a'){num.textContent=newN++}
  else if(kind==='d'){num.textContent=oldN++}
  else if(l.length||oldN||newN){num.textContent=newN;oldN++;newN++}
  sp.appendChild(num);
  const sign=el('<i class=sg></i>');sign.textContent=kind==='a'?'+':kind==='d'?'-':' ';sp.appendChild(sign);
  sp.appendChild(document.createTextNode(l.slice(kind||l.startsWith(' ')?1:0)));
  pre.appendChild(sp)});
 box.appendChild(pre);return box}

/* ---------------- /tasks ----------------
   Claude Code's background-task list: every chat answering now (and what it is doing),
   messages waiting in a queue, and shell commands a model left running -- each with a
   way to open or stop it. */
async function showTasks(){
 let d;try{d=await (await fetch('/api/tasks')).json()}catch(e){toast('could not read the tasks');return}
 const items=d.items||[];
 openSheet('Background tasks',body=>{
  if(!items.length){body.appendChild(el('<div class=sheetnote>Nothing is running in the background.</div>'));return}
  const label={answer:'answering',queued:'queued',shell:'shell',background:'background'};
  items.forEach(it=>{
   const r=el('<div class=taskrow><span class=tkind></span><div class=tmain><div class=ttitle></div><div class=tsub></div></div><div class=tacts></div></div>');
   r.querySelector('.tkind').textContent=label[it.kind]||it.kind;
   r.querySelector('.tkind').classList.add('k-'+it.kind);
   r.querySelector('.ttitle').textContent=it.title||it.id;
   const sub=[it.status];
   if(it.since)sub.push(it.ended?'took '+fmtSecs(it.ended-it.since):'for '+fmtSecs(d.now-it.since));
   if(it.text)sub.push('“'+it.text+'”');
   if(it.kind==='background'&&it.chat)sub.push('in “'+it.chat+'”');
   r.querySelector('.tsub').textContent=sub.filter(Boolean).join(' · ');
   const acts=r.querySelector('.tacts');
   if(it.kind==='background'){
    // Claude desktop's task list: open one to see what it has done so far
    const o=el('<button class=ghost>open</button>');o.title='what it has written so far';
    o.onclick=()=>showTaskOutput(it);acts.appendChild(o);
    r.style.cursor='pointer';r.onclick=e=>{if(!e.target.closest('button'))showTaskOutput(it)}}
   else if(it.sid){const o=el('<button class=ghost>open</button>');
    o.onclick=()=>{closeModal();showPane('log');openSession(it.sid)};acts.appendChild(o)}
   if(it.can_stop){const x=el(`<button class=ghost>${it.kind==='queued'?'remove':'stop'}</button>`);
    x.onclick=async()=>{
     let ok;
     if(it.kind==='answer')ok=await apiPost('/api/cancel',{sid:it.sid},'stopping');
     else if(it.kind==='queued')ok=await apiPost('/api/queue',{sid:it.sid,op:'remove',id:it.id},'removing');
     else ok=await apiPost('/api/tasks/stop',{kind:it.kind,id:it.id},'stopping');
     if(ok){x.disabled=true;x.textContent=it.kind==='queued'?'removed':'stopped';refreshRunning()}};
    acts.appendChild(x)}

// One background task: a shell's output as it grows, or a subagent's steps and words;
// kept current while it runs, with a way to its chat.
async function showTaskOutput(it){
 const url='/api/tasks/output?sid='+encodeURIComponent(it.sid||'')+'&id='+encodeURIComponent(it.id);
 let timer=null;
 openSheet(it.title||'Background task',async body=>{
  body.style.padding='12px 18px 16px';
  body.innerHTML='<div class=sheetnote>loading…</div>';
  const draw=async()=>{
   if(!body.isConnected){clearInterval(timer);return}
   let d;try{const r=await fetch(url);d=await r.json();if(!r.ok)throw new Error(d.error||r.status)}
   catch(e){body.innerHTML='';const x=el('<div class=sheetnote></div>');x.textContent='Its output is no longer available ('+(e.message||e)+').';body.appendChild(x);clearInterval(timer);return}
   const running=/^(running|pending)/.test(d.status||'');
   const stick=!body.querySelector('pre')||body.querySelector('pre').scrollTop+body.querySelector('pre').clientHeight>=body.querySelector('pre').scrollHeight-8;
   body.innerHTML='';
   const head=el('<div class=taskhead></div>');
   head.textContent=[(d.kind==='agent'?'subagent':'shell'),running?'running':(d.status||'ended'),
    d.since?(running?'for ':'took ')+fmtSecs(((d.ended||Date.now()/1000)-d.since)):'',
    d.tools?plural(+d.tools,'tool use','tool uses'):'',d.tokens?fmtTok(+d.tokens)+' tokens':''].filter(Boolean).join(' \u00b7 ');
   body.appendChild(head);
   if(d.command){const c=el('<div class=taskcmd></div>');c.textContent='$ '+d.command;body.appendChild(c)}
   if((d.steps||[]).length&&!d.output){const b=subStepsBox({steps:d.steps,tools:d.tools,type:'steps'});body.appendChild(b)}
   const pre=el('<pre class=taskout></pre>');
   pre.textContent=d.output||d.summary||(running?'(nothing written yet)':'(no output)');
   body.appendChild(pre);if(stick)pre.scrollTop=pre.scrollHeight;
   if(d.summary&&d.output){const sm=el('<div class=sheetnote></div>');sm.textContent='Reported: '+d.summary;body.appendChild(sm)}
   const acts=el('<div class=row2 style="margin-top:8px"></div>');
   if(d.output){const cp=el('<button class=ghost>copy output</button>');cp.onclick=()=>copy(d.output);acts.appendChild(cp)}
   if(it.sid&&d.chat_saved&&it.sid!==sid){const g=el('<button class=ghost>go to its chat</button>');
    g.onclick=()=>{closeModal();showPane('log');openSession(it.sid)};acts.appendChild(g)}
   body.appendChild(acts);
   if(!running&&timer){clearInterval(timer);timer=null}};
  await draw();
  timer=setInterval(draw,2000)},{sub:it.chat?'in “'+it.chat+'”':'background task'})}

// Claude Code's /context: the window as a grid of squares, one part per colour
async function showContext(){

 catch(e){toast('could not read the context');return}
 openSheet('Context window',body=>{
  const max=d.max||1,used=d.used||0;
  const parts=Object.entries(d.parts||{}).sort((a,b)=>b[1]-a[1]);
  const colours=['var(--acc)','var(--tool)','var(--think)','var(--ok)','var(--warn)','var(--err)','var(--dim)'];
  body.appendChild(el(`<div class=sheetnote>${Math.round(100*used/max)}% used —
   ${used.toLocaleString()} of ${max.toLocaleString()} tokens, ${(d.free||0).toLocaleString()} free

   ${d.autocompact_at?'Orbit compacts by itself at '+d.autocompact_at+'%.':''}</div>`));

   r.appendChild(dot);

   const v=el('<span class=ctxval></span>');

 if(body.includes('$ARGUMENTS')){body=body.split('$ARGUMENTS').join(rest);used=true}

  if(n>0&&n<=pos.length){used=true;return pos[n-1]}return m});

function openJump(){
 closePal();showPane('log');
 const all=[...wrap.querySelectorAll('.msg.u')].map((n,i)=>{
  const b=n.querySelector('.bub'),ts=n.querySelector('.who .ts');
  return {n,i,label:(b?b.textContent:'').replace(/\s+/g,' ').trim().slice(0,80)||'(image)',sub:ts?ts.textContent:''}});
 if(!all.length){toast('nothing of yours in this chat yet');return}
 pal=el(`<div class=palette><input placeholder="Jump to one of your messages…"><div class=res></div></div>`);
 document.body.appendChild(pal);
 const inp=pal.querySelector('input'),res=pal.querySelector('.res');
 let items=all;palSel=items.length-1;
 const pick=it=>{closePal();jumpTo(it.n)};
 const draw=()=>{res.innerHTML='';
  items.forEach((it,i)=>{
   const d=el(`<div class="it${i===palSel?' sel':''}"><span class=k>#${it.i+1}</span><span class=t></span><span class=s></span></div>`);
   d.querySelector('.t').textContent=it.label;d.querySelector('.s').textContent=it.sub;
   d.onclick=()=>pick(it);res.appendChild(d)});
  const s=res.children[palSel];if(s)s.scrollIntoView({block:'nearest'})};
 inp.oninput=()=>{const t=inp.value.trim().toLowerCase();
  items=all.filter(x=>!t||x.label.toLowerCase().includes(t));palSel=items.length-1;draw()};
 inp.onkeydown=e=>{
  if(e.key==='Escape')return closePal();
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,items.length-1);draw()}
  if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);draw()}
  if(e.key==='Enter'){e.preventDefault();const it=items[palSel];if(it)pick(it)}};
 draw();inp.focus();
 pal.addEventListener('click',e=>e.stopPropagation());
 setTimeout(()=>document.addEventListener('click',closePal,{once:true}),0)}

/* ---------------- usage stats ---------------- */
async function showStats(days){
 days=days||7;
 const opts=[[1,'last day'],[7,'last 7 days'],[30,'last 30 days'],[36500,'all time']];
 $('#modalhost').innerHTML=`<div class=modal><div class="sheet auto" style="max-width:760px">
  <header><b>Usage</b><select id=st_days class=ghost style="max-width:140px">${
   opts.map(([v,l])=>`<option value=${v}${v===days?' selected':''}>${l}</option>`).join('')}</select>
   <button class=ghost style="margin-left:auto" id=stx>close</button></header>
  <div class=body id=stbody><div class=note>loading…</div></div></div></div>`;
 $('#stx').onclick=closeModal;
 $('#modalhost').querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))closeModal()};
 $('#st_days').onchange=e=>showStats(+e.target.value);
 const body=$('#stbody');let d;
 try{const r=await fetch('/api/stats?days='+days);d=await r.json().catch(()=>({}));
  if(!r.ok||d.error)throw new Error(d.error||('the server answered '+r.status))}
 catch(e){body.innerHTML='';const x=el('<div class=err></div>');
  x.textContent='Could not load usage stats: '+(e.message||e);body.appendChild(x);return}
 const n=v=>(+v||0).toLocaleString();
 const models=Object.entries(d.models||{}).sort((a,b)=>(b[1].turns||0)-(a[1].turns||0));
 const tot=models.reduce((t,[,m])=>({p:t.p+(+m.prompt_tokens||0),c:t.c+(+m.completion_tokens||0),
   s:t.s+(+m.seconds||0)}),{p:0,c:0,s:0});
 const tools=Object.entries(d.tools||{}).sort((a,b)=>b[1]-a[1]).slice(0,15);
 const byDay=Object.entries(d.by_day||{}).sort((a,b)=>b[0].localeCompare(a[0]));
 const tbl=(head,rows)=>rows.length?`<table class=stbl><thead><tr>${
   head.map((h,i)=>`<th${i?' class=n':''}>${h}</th>`).join('')}</tr></thead><tbody>${
   rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class=n':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`
  :'<div class=note>nothing in this period</div>';
 body.innerHTML=`<div class=stat>
   <div><b>${n(d.turns)}</b><small>turns</small></div>
   <div><b>${n(tot.p+tot.c)}</b><small>tokens · ${n(tot.c)} out</small></div>
   <div><b>${fmtSecs(tot.s)}</b><small>model time</small></div></div>
  <div class=sec style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">By model</div>${
   tbl(['model','turns','prompt tok','output tok','time','tok/s'],models.map(([k,m])=>[esc(k),n(m.turns),
    n(m.prompt_tokens),n(m.completion_tokens),fmtSecs(m.seconds),
    m.seconds>0&&m.completion_tokens?(m.completion_tokens/m.seconds).toFixed(1):'—']))}
  <div class=sec>Top tools</div>${tbl(['tool','calls'],tools.map(([k,v])=>[esc(k),n(v)]))}
  <div class=sec>By day</div>${tbl(['day','turns','tokens'],byDay.map(([k,v])=>[esc(k),n(v.turns),n(v.tokens)]))}`}

async function suggestMem(){
 sysline('looking for durable facts...');

 if(!d.items||!d.items.length)return sysline('nothing worth remembering from this chat');
 const box=el('<div class=msg></div>');
 box.appendChild(el('<div class=who>suggested memories</div>'));
 d.items.forEach(it=>{
  const r=el('<div class=memrow style="margin:6px 0"><b></b><span></span><button class=ghost>save</button><button class=ghost>skip</button></div>');
  r.querySelector('b').textContent=it.name;r.querySelector('span').textContent=it.content;
  const [sv,sk]=r.querySelectorAll('button');
  sv.onclick=async()=>{await fetch('/api/memory/save',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({name:it.name,text:it.content})});
   r.querySelector('span').textContent='saved';sv.remove();sk.remove()};
  sk.onclick=()=>r.remove();
  box.appendChild(r)});
 wrap.appendChild(box);bottom()}

const PAGE_LOADED=Date.now()/1000;
async function checkCode(){
 try{const c=await (await fetch('/api/code')).json();
  // the page itself changed on disk since this tab loaded it: fixes to the
  // page only arrive with a reload, and nothing used to say so
  if(c.page_mtime&&c.page_mtime>PAGE_LOADED+2&&!document.querySelector('.reloadBar')){
   const b=el('<div class="staleBar reloadBar"><span>Orbit\'s page was updated — reload to get the new version.</span></div>');
   const btn=el('<button>Reload</button>');btn.onclick=()=>location.reload();b.appendChild(btn);
   document.body.appendChild(b)}
  const bar=document.querySelector('.staleBar:not(.reloadBar)');   // not the page-reload bar
  if(c.stale&&!bar){
   const b=el(`<div class=staleBar><span>Code changed on disk (${c.files.join(', ')}) — `
     +`the running interface is out of date.</span></div>`);
   const btn=el('<button>Restart interface</button>');
   btn.onclick=async()=>{
    btn.disabled=true;btn.textContent='restarting…';
    const rr=await fetch('/api/restart_ui',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
      .then(r=>r.json()).catch(()=>({}));
    if(rr.deferred){btn.textContent=rr.msg||'restarting when answers finish';toast(rr.msg||'waiting for running answers');return}
    // wait for it to actually come back instead of reloading into a dead server
    const t0=Date.now();
    const poll=async()=>{
     try{const r=await fetch('/api/code',{cache:'no-store'});
      if(r.ok){location.reload();return}}catch(e){}
     const secs=Math.round((Date.now()-t0)/1000);
     btn.textContent=`restarting… ${secs}s`;
     if(secs>60){btn.textContent='still down — check logs';btn.disabled=false;return}
     setTimeout(poll,700)};
    setTimeout(poll,700)};
   b.appendChild(btn);document.body.appendChild(b)}
  else if(!c.stale&&bar)bar.remove();
 }catch(e){}}
checkCode(); setInterval(checkCode,15000);
