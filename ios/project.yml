name: Orbit
options:
  bundleIdPrefix: uk.runtian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.runtian.orbit
        INFOPLIST_KEY_CFBundleDisplayName: Orbit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scanning the pairing QR code on your Mac, and taking photos to send in a chat."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Finding your Mac running Orbit on this network."
        INFOPLIST_KEY_NSBonjourServices: "_orbit._tcp"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attaching an image to a conversation."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: uk.runtian.orbit.pair
            CFBundleURLSchemes: [orbit]
        UIBackgroundModes: [processing]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
