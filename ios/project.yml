name: Orbit
options:
  bundleIdPrefix: uk.runtian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.runtian.orbit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Everything below goes into Info.plist itself. INFOPLIST_KEY_* build
    # settings are ignored when a plist file is supplied, which once shipped a
    # build with no launch screen (letterboxed on modern phones) and no camera
    # usage string (iOS kills the app the moment the QR scanner opens).
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Scanning the pairing QR code on your Mac, and taking photos to send in a chat."
        NSLocalNetworkUsageDescription: "Finding your Mac running Orbit on this network."
        NSBonjourServices: ["_orbit._tcp"]
        NSPhotoLibraryUsageDescription: "Attaching an image to a conversation."
        NSPhotoLibraryAddUsageDescription: "Saving a plot or picture from a conversation to your Photos."
        NSFaceIDUsageDescription: "Unlocking Orbit when you have asked it to lock."
        CFBundleURLTypes:
          - CFBundleURLName: uk.runtian.orbit.pair
            CFBundleURLSchemes: [orbit]
        UIBackgroundModes: [processing]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
